<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI記述問題採点アプリ Powered by Groq</title>
    <style>
        :root {
            --primary: #f55036; /* Groq Orange */
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header & Logo */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Groq Logo Simulation (SVG) */
        .groq-logo {
            height: 40px;
            width: auto;
        }

        h1 {
            color: var(--text);
            font-size: 1.5rem;
            margin: 0;
        }

        .powered-by {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }

        /* Card Style */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        h2 { font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 15px; color: var(--primary); }
        
        /* Inputs */
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(245, 80, 54, 0.2);
        }

        /* Drop Zone */
        #drop-zone {
            border: 2px dashed #d1d5db;
            padding: 40px;
            text-align: center;
            background-color: #f3f4f6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #drop-zone:hover { background-color: #e5e7eb; }
        #drop-zone.dragover {
            background-color: #fff7ed;
            border-color: var(--primary);
            color: var(--primary);
        }
        
        /* Buttons */
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: opacity 0.2s;
            width: 100%;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }

        /* Question Items */
        .question-item {
            border-left: 5px solid var(--primary);
            background: #fff;
            padding: 24px;
            margin-bottom: 30px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .q-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .q-title { font-weight: bold; color: var(--primary); }
        
        .q-text { font-size: 1.1rem; margin-bottom: 15px; white-space: pre-wrap; font-weight: 500; }
        
        .criteria-box {
            background-color: #fff7ed;
            border: 1px solid #ffedd5;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none; /* 初期状態は非表示 */
            font-size: 0.95rem;
            color: #4b5563;
        }

        .toggle-btn {
            background: none; border: none; color: #6b7280; font-size: 0.85rem; cursor: pointer; padding: 0; text-decoration: underline; width: auto; text-align: right;
        }
        .toggle-btn:hover { color: var(--primary); }

        /* Result Area */
        .result-area {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            display: none;
            white-space: pre-wrap;
            color: #166534;
        }
        .result-area.loading {
            background-color: #fffbeb;
            border-color: #fde68a;
            color: #92400e;
        }
        
        /* Markdown rendering simulation for simple lists */
        .result-area ul { padding-left: 20px; margin: 10px 0; }
        .result-area li { margin-bottom: 5px; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <svg class="groq-logo" viewBox="0 0 100 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 10H5V30H15V20H10V25H15V30" stroke="#f55036" stroke-width="4"/>
                <text x="25" y="30" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#f55036">groq</text>
            </svg>
            <h1>記述問題 AI採点</h1>
        </div>
        <div class="powered-by">Powered by Groq Llama 3</div>
    </header>

    <div class="card" style="border-top: 4px solid var(--primary);">
        <details>
            <summary style="cursor:pointer; font-weight:bold; color:#666;">⚙️ APIキー設定 (設定済み)</summary>
            <div style="margin-top:10px;">
                <p style="font-size:0.85rem; color:#666;">指定されたキーが既に入力されています。変更する場合のみ編集してください。</p>
                <input type="password" id="apiKey" value="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" onchange="saveApiKey()">
            </div>
        </details>
    </div>

    <div class="card">
        <h2>📂 問題データの読み込み</h2>
        <div id="drop-zone">
            <p style="margin:0; font-size:1.1rem; color:#4b5563;">
                ここにテキストファイルをドラッグ＆ドロップ<br>
                <span style="font-size:0.9rem; color:#9ca3af;">またはクリックして選択</span>
            </p>
            <input type="file" id="fileInput" accept=".txt" style="display:none">
        </div>
        <div style="text-align:center; margin: 15px 0; font-size:0.9rem; color:#9ca3af;">- または直接入力 -</div>
        <textarea id="rawTextInput" rows="4" placeholder="Q: 問題文...&#13;&#10;基準: 解答基準...&#13;&#10;---&#13;&#10;Q: 次の問題..."></textarea>
        <button onclick="loadQuestions()">問題を展開する</button>
    </div>

    <div id="questions-container"></div>
</div>

<script>
    // --- Configuration ---
    const STORAGE_KEY = 'groq_api_key_custom';
    
    // Load API Key (Priority: LocalStorage > Default Value in HTML)
    window.onload = () => {
        const savedKey = localStorage.getItem(STORAGE_KEY);
        // もしLocalStorageに保存されたキーがあればそれを優先、なければHTML内のvalue(指定されたキー)を使う
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    };

    function saveApiKey() {
        const key = document.getElementById('apiKey').value;
        localStorage.setItem(STORAGE_KEY, key);
    }

    // --- File Handling ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            readFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (fileInput.files.length) {
            readFile(fileInput.files[0]);
        }
    });

    function readFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('rawTextInput').value = e.target.result;
        };
        reader.readAsText(file);
    }

    // --- Parsing Logic ---
    let questionsData = [];

    function loadQuestions() {
        const text = document.getElementById('rawTextInput').value;
        if (!text.trim()) {
            alert("テキストが空です。");
            return;
        }

        // 区切り文字 "---" で分割
        const blocks = text.split(/^---$/gm);
        questionsData = [];
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        blocks.forEach((block, index) => {
            if (!block.trim()) return;

            // 簡易パーサー: "基準" "解答" などのキーワードで分割を試みる
            // 見つからない場合は全体を問題文とし、基準はAI任せにする
            const splitRegex = /(?:基準|解答|答え|正解|A)[:：\n]/;
            const parts = block.split(splitRegex);

            let questionText = "";
            let criteriaText = "";

            if (parts.length >= 2) {
                questionText = parts[0].replace(/^(問題|Q)[:：]/i, '').trim();
                criteriaText = block.substring(parts[0].length).trim();
            } else {
                questionText = block.replace(/^(問題|Q)[:：]/i, '').trim();
                criteriaText = "（明示的な基準なし。AIが一般的知識に基づいて採点します）";
            }

            questionsData.push({ q: questionText, c: criteriaText });
            renderQuestion(index, questionText, criteriaText);
        });

        if (questionsData.length === 0) {
            alert("有効な問題が見つかりませんでした。区切り文字 --- を確認してください。");
        }
    }

    function renderQuestion(index, q, c) {
        const container = document.getElementById('questions-container');
        
        const html = `
            <div class="question-item">
                <div class="q-header">
                    <span class="q-title">問 ${index + 1}</span>
                    <button class="toggle-btn" onclick="toggleCriteria(${index})">採点基準を確認する</button>
                </div>
                
                <div class="q-text">${q}</div>
                
                <div id="criteria-${index}" class="criteria-box">
                    <strong>【採点基準・正解】</strong><br>
                    ${c}
                </div>

                <label>あなたの回答:</label>
                <textarea id="answer-${index}" rows="3" placeholder="ここに入力してください..."></textarea>
                
                <button onclick="gradeAnswer(${index})" id="btn-${index}">AI採点実行</button>
                
                <div id="result-${index}" class="result-area"></div>
            </div>
        `;
        
        container.insertAdjacentHTML('beforeend', html);
    }

    function toggleCriteria(index) {
        const el = document.getElementById(`criteria-${index}`);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    // --- Groq API Interaction ---
    async function gradeAnswer(index) {
        const apiKey = document.getElementById('apiKey').value;
        if (!apiKey) {
            alert("APIキーが設定されていません。");
            return;
        }

        const qData = questionsData[index];
        const userAnswer = document.getElementById(`answer-${index}`).value;

        if (!userAnswer.trim()) {
            alert("回答を入力してください。");
            return;
        }

        const btn = document.getElementById(`btn-${index}`);
        const resultDiv = document.getElementById(`result-${index}`);
        
        // Loading State
        btn.disabled = true;
        btn.innerText = "採点中...";
        resultDiv.style.display = "block";
        resultDiv.className = "result-area loading";
        resultDiv.innerText = "AI先生が採点しています...";

        // Prompts
        const systemPrompt = `あなたは優秀な社会科の先生です。生徒の記述回答を採点します。
提示された「採点基準」に照らし合わせて、厳格かつ公平に採点してください。
基準にない要素でも、事実として正しく、問いに答えていれば加点してください。
出力はMarkdown形式を使わず、シンプルなテキストで構成してください。`;

        const userPrompt = `
以下の問題に対する生徒の回答を採点してください。

【問題】
${qData.q}

【採点基準・正解】
${qData.c}

【生徒の回答】
${userAnswer}

---
【出力フォーマット】
以下の形式で出力してください：

判定：[正解 / 部分点 / 不正解]
点数：[0〜100]点

【良かった点】
・(具体的に)

【改善点・解説】
・(不足している要素や誤りについて具体的に)
`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant", // 高速モデル
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userPrompt }
                    ],
                    temperature: 0.3, // 厳密さを出すため低めに設定
                    max_tokens: 1024
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "通信エラーが発生しました");
            }

            const data = await response.json();
            const aiText = data.choices[0].message.content;
            
            // Display Result
            resultDiv.className = "result-area";
            resultDiv.innerText = aiText;

        } catch (error) {
            console.error(error);
            resultDiv.innerText = "エラーが発生しました:\n" + error.message;
            resultDiv.style.color = "#dc2626";
            resultDiv.style.backgroundColor = "#fef2f2";
            resultDiv.style.borderColor = "#fca5a5";
        } finally {
            btn.disabled = false;
            btn.innerText = "AI採点実行";
        }
    }
</script>

</body>
</html>
